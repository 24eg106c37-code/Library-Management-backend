spring.application.name=online-library
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
library.admin.username=${ADMIN_USERNAME:admin}
library.admin.password=${ADMIN_PASSWORD:admin123}
library.due-days=${LIBRARY_DUE_DAYS:14}
library.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5500}